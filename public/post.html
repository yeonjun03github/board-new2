<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>글 상세</title>
</head>
<body>

<p id="not-found-message" style="display:none">존재하지 않는 게시글입니다.</p>

<div id="post-container" style="display:none">
    <button onclick="window.location.href='/index.html'">목록으로</button>
    <button id="edit-btn" onclick="goEdit()" style="display:none">수정</button>
    <button id="delete-btn" onclick="deletePost()" style="display:none">삭제</button>

    <h2 id="title"></h2>
    <p>작성자: <span id="username"></span></p>
    <p>작성일: <span id="created-at"></span></p>
    <p>조회수: <span id="views"></span></p>
    <button id="like-btn" onclick="toggleLike()">🤍 좋아요</button> <span id="like-count"></span>
    <hr>
    <p id="content"></p>
    <div id="image-container"></div>

    <hr>
    <h3>댓글</h3>
    <div id="comments"></div>

    <textarea id="comment-input" placeholder="댓글을 입력하세요" rows="3" cols="50"></textarea>
    <br>
    <button onclick="submitComment()">댓글 작성</button>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const token = localStorage.getItem('token');
    let myUserId = null;

    if (token) {
        const payload = JSON.parse(atob(token.split('.')[1]));
        myUserId = payload.id;
    }

    async function loadPost() {
        const res = await fetch(`/posts/${id}`);

        if (!res.ok) {
            document.getElementById('not-found-message').style.display = 'block';
            document.getElementById('post-container').style.display = 'none';
            return false;
        }

        const post = await res.json();

        document.getElementById('post-container').style.display = 'block';
        document.getElementById('title').innerText = post.title;
        document.getElementById('username').innerText = post.username;
        document.getElementById('content').innerText = post.content;
        document.getElementById('created-at').innerText = new Date(post.created_at).toLocaleDateString('ko-KR');
        document.getElementById('views').innerText = post.views;

        if (post.image) {
            const img = document.createElement('img');
            img.src = post.image;
            img.style.maxWidth = '500px';
            document.getElementById('image-container').appendChild(img);
        }

        if (myUserId && myUserId === post.user_id) {
            document.getElementById('edit-btn').style.display = 'inline';
            document.getElementById('delete-btn').style.display = 'inline';
        }

        return true;
    }

    async function loadLikes() {
        const res = await fetch(`/posts/${id}/likes`);
        const likes = await res.json();

        document.getElementById('like-count').innerText = `${likes.length}명이 좋아합니다`;

        const liked = myUserId !== null && likes.some(like => like.user_id === myUserId);
        document.getElementById('like-btn').innerText = liked ? '❤️ 좋아요 취소' : '🤍 좋아요';
    }

    async function toggleLike() {
        if (!token) {
            alert('로그인이 필요합니다.');
            window.location.href = '/login.html';
            return;
        }

        const res = await fetch(`/posts/${id}/likes`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.status === 401) {
            localStorage.removeItem('token');
            alert('로그인이 만료되었습니다. 다시 로그인해주세요.');
            window.location.href = '/login.html';
            return;
        }

        loadLikes();
    }

    async function loadComments() {
        const res = await fetch(`/comments/${id}`);
        const data = await res.json();
        const container = document.getElementById('comments');
        container.innerHTML = '';

        if (!Array.isArray(data)) return;

        // parent_id 별로 묶기 (null → 일반 댓글, 숫자 → 그 댓글의 대댓글)
        const childrenOf = {};
        data.forEach(comment => {
            const key = comment.parent_id === null ? 'root' : comment.parent_id;
            (childrenOf[key] = childrenOf[key] || []).push(comment);
        });

        const render = (comment, depth) => {
            const div = document.createElement('div');
            div.style.marginLeft = `${depth * 30}px`;

            const p = document.createElement('p');
            const name = document.createElement('strong');
            name.textContent = comment.username;
            const span = document.createElement('span');
            span.id = `comment-content-${comment.id}`;
            span.textContent = comment.content;
            if (comment.is_deleted) span.style.color = 'gray';
            p.append(depth > 0 ? '↳ ' : '', name, ': ', span);
            div.appendChild(p);

            // 삭제된 댓글에는 버튼(답글/수정/삭제)을 보여주지 않음
            if (!comment.is_deleted) {
                // 좋아요 버튼 (개수는 서버에서 받아서 채움)
                const likeBtn = document.createElement('button');
                likeBtn.textContent = '🤍 0';
                likeBtn.onclick = () => toggleCommentLike(comment.id, likeBtn);
                div.appendChild(likeBtn);
                refreshCommentLike(comment.id, likeBtn);

                // 답글은 일반 댓글에만 (한 단계까지)
                if (depth === 0) {
                    const replyBtn = document.createElement('button');
                    replyBtn.textContent = '답글';
                    replyBtn.onclick = () => showReplyForm(div, comment.id);
                    div.appendChild(replyBtn);
                }
                if (myUserId == comment.user_id) {
                    const editBtn = document.createElement('button');
                    editBtn.textContent = '수정';
                    editBtn.onclick = () => editComment(comment.id);
                    const delBtn = document.createElement('button');
                    delBtn.textContent = '삭제';
                    delBtn.onclick = () => removeComment(comment.id);
                    div.append(editBtn, delBtn);
                }
            }

            container.appendChild(div);
            (childrenOf[comment.id] || []).forEach(child => render(child, depth + 1));
            if (depth === 0) container.appendChild(document.createElement('hr'));
        };

        (childrenOf['root'] || []).forEach(comment => render(comment, 0));
    }

    // 댓글 좋아요: 개수와 내가 눌렀는지를 버튼에 표시
    async function refreshCommentLike(commentId, btn) {
        const res = await fetch(`/comments/${commentId}/likes`);
        const likes = await res.json();
        if (!Array.isArray(likes)) return;

        const liked = myUserId !== null && likes.some(like => like.user_id === myUserId);
        btn.textContent = `${liked ? '❤️' : '🤍'} ${likes.length}`;
    }

    async function toggleCommentLike(commentId, btn) {
        if (!token) {
            alert('로그인이 필요합니다.');
            window.location.href = '/login.html';
            return;
        }

        const res = await fetch(`/comments/${commentId}/likes`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.status === 401) {
            localStorage.removeItem('token');
            alert('로그인이 만료되었습니다. 다시 로그인해주세요.');
            window.location.href = '/login.html';
            return;
        }

        if (res.status === 404) {
            const data = await res.json();
            alert(data.message);
            loadComments();
            return;
        }

        refreshCommentLike(commentId, btn);
    }

    // 답글 입력창 (이미 열려 있으면 닫기)
    function showReplyForm(commentDiv, parentId) {
        const existing = commentDiv.querySelector('.reply-form');
        if (existing) return existing.remove();

        const form = document.createElement('div');
        form.className = 'reply-form';
        form.style.marginTop = '6px';

        const textarea = document.createElement('textarea');
        textarea.rows = 2;
        textarea.cols = 40;
        textarea.placeholder = '답글을 입력하세요';

        const submitBtn = document.createElement('button');
        submitBtn.textContent = '답글 등록';
        submitBtn.onclick = () => submitComment(parentId, textarea.value);

        const cancelBtn = document.createElement('button');
        cancelBtn.textContent = '취소';
        cancelBtn.onclick = () => form.remove();

        form.append(textarea, document.createElement('br'), submitBtn, cancelBtn);
        commentDiv.appendChild(form);
        textarea.focus();
    }

    // parentId가 있으면 대댓글, 없으면 일반 댓글 (입력창 값은 content 인자로 받거나 기본 댓글 입력창에서 읽음)
    async function submitComment(parentId = null, replyContent = null) {
        if (!token) {
            alert('로그인이 필요합니다.');
            window.location.href = '/login.html';
            return;
        }

        const isReply = parentId !== null;
        const content = isReply ? replyContent : document.getElementById('comment-input').value;
        if (!content || !content.trim()) return alert('댓글을 입력해주세요.');

        const res = await fetch(`/comments/${id}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ content, parent_id: parentId })
        });

        if (res.status === 401) {
            localStorage.removeItem('token');
            alert('로그인이 만료되었습니다. 다시 로그인해주세요.');
            window.location.href = '/login.html';
            return;
        }

        const data = await res.json();
        alert(data.message);
        if (!isReply) document.getElementById('comment-input').value = '';
        loadComments();
    }

    async function editComment(commentId) {
        const span = document.getElementById(`comment-content-${commentId}`);
        const newContent = prompt('댓글을 수정하세요', span.innerText);
        if (newContent === null) return;
        if (!newContent.trim()) return alert('내용을 입력해주세요.');

        const res = await fetch(`/comments/${commentId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ content: newContent })
        });

        if (res.status === 401) {
            localStorage.removeItem('token');
            alert('로그인이 만료되었습니다. 다시 로그인해주세요.');
            window.location.href = '/login.html';
            return;
        }

        const data = await res.json();
        alert(data.message);
        loadComments();
    }

    async function removeComment(commentId) {
        if (!confirm('댓글을 삭제하시겠습니까?')) return;
        const res = await fetch(`/comments/${commentId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.status === 401) {
            localStorage.removeItem('token');
            alert('로그인이 만료되었습니다. 다시 로그인해주세요.');
            window.location.href = '/login.html';
            return;
        }

        const data = await res.json();
        alert(data.message);
        loadComments();
    }

    function goEdit() {
        window.location.href = `/edit.html?id=${id}`;
    }

    async function deletePost() {
        if (!confirm('삭제하시겠습니까?')) return;
        const res = await fetch(`/posts/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.status === 401) {
            localStorage.removeItem('token');
            alert('로그인이 만료되었습니다. 다시 로그인해주세요.');
            window.location.href = '/login.html';
            return;
        }

        const data = await res.json();
        alert(data.message);
        window.location.href = '/index.html';
    }

    loadPost().then(found => {
        if (found) {
            loadComments();
            loadLikes();
        }
    });
</script>
</body>
</html>
